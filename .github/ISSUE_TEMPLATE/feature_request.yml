name: Feature Request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        有新想法？太好了 ✨
        请告诉我们你希望看到什么。

  - type: dropdown
    id: category
    attributes:
      label: 功能类别
      options:
        - 新测试 / 新维度
        - UI / 交互改进
        - 结果展示优化
        - 关系配对功能
        - 性能 / 可访问性
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题或需求
      description: 这个功能解决什么问题？或者你想探索什么？
      placeholder: 我希望能……因为……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望这个功能是什么样的？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他实现方式？
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 参考链接、截图、或任何有助于理解你想法的内容
    validations:
      required: false