name: Feature request
description: Suggest a quiz, UI, accessibility, or content improvement.
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Area
      options:
        - Quiz content
        - Results page
        - Accessibility
        - Internationalization
        - Performance
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What would this improve for users?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Product boundary
      options:
        - label: This request keeps the app as self-reflection, not diagnosis or treatment.
          required: true
