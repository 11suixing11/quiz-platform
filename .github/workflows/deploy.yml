name: Validate and deploy application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    # Match the Ubuntu 24.04 production host so native addons do not acquire a
    # newer glibc dependency than the VPS can provide.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Validate registry and scoring
        run: npm test
      - name: Audit flagship routes
        run: npm run audit:flagship
      - name: Accessibility audit
        run: npm run audit:a11y
      - name: Build standalone application
        run: npm run build
      - name: Prepare standalone assets
        run: npm run package:standalone
      - name: Verify Linux native addon
        run: |
          set -euo pipefail
          addon=.next/standalone/node_modules/better-sqlite3/build/Release/better_sqlite3.node
          test -f "$addon"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          python3 - "$addon" <<'PY'
          from pathlib import Path
          import sys

          header = Path(sys.argv[1]).read_bytes()[:20]
          if header[:4] != b"\x7fELF" or len(header) < 20 or header[4] != 2:
              raise SystemExit("better-sqlite3 addon is not an ELF64 Linux binary")
          # ELF e_machine at bytes 18..19: 0x3e = AMD x86-64.
          if int.from_bytes(header[18:20], "little") != 0x3E:
              raise SystemExit("better-sqlite3 addon is not an x86-64 ELF binary")
          PY
          file "$addon"
          file "$addon" | grep -E 'ELF 64-bit.*x86-64'
          node <<'NODE'
          const Database = require("./.next/standalone/node_modules/better-sqlite3");
          const database = new Database(":memory:");
          database.exec("SELECT 1");
          database.close();
          NODE
      - name: Package standalone release
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/public
          test -d .next/standalone/.next/static
          tar -C .next/standalone -czf quiz-platform.tar.gz .
          tar -tzf quiz-platform.tar.gz >/dev/null
      - name: Upload standalone release
        uses: actions/upload-artifact@v4
        with:
          name: standalone-release
          path: quiz-platform.tar.gz
          retention-days: 7

  deploy:
    name: Deploy production release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://knowyourself.cc.cd/
    steps:
      - name: Download standalone release
        uses: actions/download-artifact@v4
        with:
          name: standalone-release
      - name: Configure deployment SSH
        env:
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_DEPLOY_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Upload and activate release
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          remote="$VPS_USER@$VPS_HOST"
          ssh "${ssh_options[@]}" "$remote" "install -d -m 0755 /srv/quiz-platform/releases/.incoming"
          scp "${ssh_options[@]}" quiz-platform.tar.gz "$remote:/srv/quiz-platform/releases/.incoming/$GITHUB_SHA.tar.gz"
          ssh "${ssh_options[@]}" "$remote" "bash -s -- $GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          release="$1"
          [[ "$release" =~ ^[0-9a-f]{40}$ ]]
          releases=/srv/quiz-platform/releases
          archive="$releases/.incoming/$release.tar.gz"
          staging="$releases/.incoming/$release"
          target="$releases/$release"
          previous="$(readlink -f "$releases/current" 2>/dev/null || true)"

          test -s "$archive"
          rm -rf "$staging"
          if [ -e "$target" ]; then
            test -f "$target/server.js"
            test -d "$target/public"
            test -d "$target/.next/static"
          else
            mkdir "$staging"
            tar -xzf "$archive" -C "$staging"
            test -f "$staging/server.js"
            test -d "$staging/public"
            test -d "$staging/.next/static"
            test -f "$staging/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
            find "$staging" -type d -exec chmod 0755 {} +
            find "$staging" -type f -exec chmod 0644 {} +
            find "$staging" -type f -name '*.node' -exec chmod 0755 {} +
            mv "$staging" "$target"
          fi
          TARGET="$target" /usr/bin/node <<'NODE'
          const Database = require(`${process.env.TARGET}/node_modules/better-sqlite3`);
          const database = new Database(":memory:");
          database.exec("SELECT 1");
          database.close();
          NODE
          if [ -n "$previous" ] && [ "$previous" != "$target" ]; then
            rm -f "$releases/.previous-$release"
            ln -s "$previous" "$releases/.previous-$release"
            mv -Tf "$releases/.previous-$release" "$releases/previous"
          fi
          rm -f "$releases/.current-$release"
          ln -s "$target" "$releases/.current-$release"
          mv -Tf "$releases/.current-$release" "$releases/current"
          rm -f "$archive"
          application_origin=http://127.0.0.1:3333
          if ! sudo -n systemctl restart quiz-platform || ! sudo -n systemctl is-active quiz-platform >/dev/null || \
             ! curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-all-errors -H 'Host: knowyourself.cc.cd' "$application_origin/" -o /dev/null || \
             ! curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors -H 'Host: knowyourself.cc.cd' "$application_origin/test/big-five/" -o /dev/null || \
             ! test "$(curl --fail --silent --show-error -H 'Host: knowyourself.cc.cd' "$application_origin/api/auth/get-session")" = null; then
            if [ -n "$previous" ] && [ -d "$previous" ]; then
              rm -f "$releases/.rollback"
              ln -s "$previous" "$releases/.rollback"
              mv -Tf "$releases/.rollback" "$releases/current"
              sudo -n systemctl restart quiz-platform || true
            fi
            exit 1
          fi
          REMOTE
      - name: Smoke test public origin
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          canonical_host=knowyourself.cc.cd
          www_host=www.knowyourself.cc.cd
          legacy_host=loveyourself.cc.cd
          maintenance_host=quiz.107-151-246-167.sslip.io
          test_path=/test/big-five/

          curl --fail --silent --show-error --retry 5 --retry-all-errors --resolve "$maintenance_host:443:$VPS_HOST" "https://$maintenance_host/" -o /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --resolve "$maintenance_host:443:$VPS_HOST" "https://$maintenance_host$test_path" -o /dev/null
          test "$(curl --fail --silent --show-error --resolve "$maintenance_host:443:$VPS_HOST" "https://$maintenance_host/healthz")" = ok
          curl --fail --silent --show-error --resolve "$maintenance_host:443:$VPS_HOST" "https://$maintenance_host/robots.txt" | grep -F "Sitemap: https://$canonical_host/sitemap.xml"
          curl --fail --silent --show-error --resolve "$maintenance_host:443:$VPS_HOST" "https://$maintenance_host/sitemap.xml" | grep -F "<loc>https://$canonical_host$test_path</loc>"

          resolves_to_origin() {
            getent ahostsv4 "$1" | awk -v expected="$VPS_HOST" '$1 == expected { found = 1 } END { exit !found }'
          }

          tls_ready() {
            curl --silent --show-error --output /dev/null --connect-timeout 5 --max-time 15 \
              --resolve "$1:443:$VPS_HOST" "https://$1/"
          }

          if ! resolves_to_origin "$canonical_host" || ! resolves_to_origin "$www_host"; then
            echo "::notice::Canonical DNS is not active at the production origin yet; maintenance-host checks passed."
          elif ! tls_ready "$canonical_host" || ! tls_ready "$www_host"; then
            echo "::notice::Canonical TLS certificates are not ready yet; maintenance-host checks passed."
          else
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --resolve "$legacy_host:443:$VPS_HOST" "https://$legacy_host$test_path")" = 301
            test "$(curl --silent --show-error --head --resolve "$legacy_host:443:$VPS_HOST" "https://$legacy_host$test_path" | tr -d '\r' | awk 'BEGIN { IGNORECASE=1 } /^location:/ { print $2; exit }')" = "https://$canonical_host$test_path"
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --resolve "$www_host:443:$VPS_HOST" "https://$www_host$test_path")" = 301
            test "$(curl --silent --show-error --head --resolve "$www_host:443:$VPS_HOST" "https://$www_host$test_path" | tr -d '\r' | awk 'BEGIN { IGNORECASE=1 } /^location:/ { print $2; exit }')" = "https://$canonical_host$test_path"
            curl --fail --silent --show-error --retry 5 --retry-all-errors --resolve "$canonical_host:443:$VPS_HOST" "https://$canonical_host/" -o /dev/null
            curl --fail --silent --show-error --retry 5 --retry-all-errors --resolve "$canonical_host:443:$VPS_HOST" "https://$canonical_host$test_path" -o /dev/null
            test "$(curl --fail --silent --show-error --resolve "$canonical_host:443:$VPS_HOST" "https://$canonical_host/healthz")" = ok
            curl --fail --silent --show-error --resolve "$canonical_host:443:$VPS_HOST" "https://$canonical_host/robots.txt" | grep -F "Sitemap: https://$canonical_host/sitemap.xml"
            curl --fail --silent --show-error --resolve "$canonical_host:443:$VPS_HOST" "https://$canonical_host/sitemap.xml" | grep -F "<loc>https://$canonical_host$test_path</loc>"
          fi
