name: Validate and deploy application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    # Match the Ubuntu 24.04 production host so native addons do not acquire a
    # newer glibc dependency than the VPS can provide.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Validate registry and scoring
        run: npm test
      - name: Audit flagship routes
        run: npm run audit:flagship
      - name: Accessibility audit
        run: npm run audit:a11y
      - name: Build standalone application
        run: npm run build
      - name: Prepare standalone assets
        run: npm run package:standalone
      - name: Verify Linux native addons and media runtime
        run: |
          set -euo pipefail
          addon=.next/standalone/node_modules/better-sqlite3/build/Release/better_sqlite3.node
          test -f "$addon"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          python3 - "$addon" <<'PY'
          from pathlib import Path
          import sys

          header = Path(sys.argv[1]).read_bytes()[:20]
          if header[:4] != b"\x7fELF" or len(header) < 20 or header[4] != 2:
              raise SystemExit("better-sqlite3 addon is not an ELF64 Linux binary")
          # ELF e_machine at bytes 18..19: 0x3e = AMD x86-64.
          if int.from_bytes(header[18:20], "little") != 0x3E:
              raise SystemExit("better-sqlite3 addon is not an x86-64 ELF binary")
          PY
          file "$addon"
          file "$addon" | grep -E 'ELF 64-bit.*x86-64'
          sharp_addon="$(find .next/standalone/node_modules/@img -path '*sharp-linux-x64*/lib/sharp-linux-x64*.node' -print -quit)"
          test -n "$sharp_addon"
          test -f "$sharp_addon"
          file "$sharp_addon" | grep -E 'ELF 64-bit.*x86-64'
          test -f .next/standalone/next-server.js
          test -f .next/standalone/media-worker.mjs
          test -f .next/standalone/media-backup.mjs
          test -f .next/standalone/media-restore.mjs
          node <<'NODE'
          const Database = require("./.next/standalone/node_modules/better-sqlite3");
          const sharp = require("./.next/standalone/node_modules/sharp");
          const database = new Database(":memory:");
          database.exec("SELECT 1");
          database.close();
          sharp({ create: { width: 1, height: 1, channels: 3, background: "#fff" } }).webp().toBuffer()
            .then((buffer) => { if (!buffer.length) process.exit(1); })
            .catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Package standalone release
        run: |
          test -f .next/standalone/server.js
          test -f .next/standalone/next-server.js
          test -f .next/standalone/media-worker.mjs
          test -d .next/standalone/public
          test -d .next/standalone/.next/static
          tar -C .next/standalone -czf quiz-platform.tar.gz .
          tar -tzf quiz-platform.tar.gz >/dev/null
      - name: Upload standalone release
        uses: actions/upload-artifact@v4
        with:
          name: standalone-release
          path: quiz-platform.tar.gz
          retention-days: 7

  deploy:
    name: Deploy production release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://knowyourself.cc.cd/
    steps:
      - name: Download standalone release
        uses: actions/download-artifact@v4
        with:
          name: standalone-release
      - name: Configure deployment SSH
        env:
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_DEPLOY_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Upload and activate release
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          remote="$VPS_USER@$VPS_HOST"
          ssh "${ssh_options[@]}" "$remote" "install -d -m 0755 /srv/quiz-platform/releases/.incoming"
          scp "${ssh_options[@]}" quiz-platform.tar.gz "$remote:/srv/quiz-platform/releases/.incoming/$GITHUB_SHA.tar.gz"
          ssh "${ssh_options[@]}" "$remote" "bash -s -- $GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          release="$1"
          [[ "$release" =~ ^[0-9a-f]{40}$ ]]
          releases=/srv/quiz-platform/releases
          archive="$releases/.incoming/$release.tar.gz"
          staging="$releases/.incoming/$release"
          target="$releases/$release"
          previous="$(readlink -f "$releases/current" 2>/dev/null || true)"

          test -s "$archive"
          rm -rf "$staging"
          if [ -e "$target" ]; then
            test -f "$target/server.js"
            test -d "$target/public"
            test -d "$target/.next/static"
          else
            mkdir "$staging"
            tar -xzf "$archive" -C "$staging"
            test -f "$staging/server.js"
            test -f "$staging/next-server.js"
            test -f "$staging/media-worker.mjs"
            test -f "$staging/media-backup.mjs"
            test -f "$staging/media-restore.mjs"
            test -d "$staging/public"
            test -d "$staging/.next/static"
            test -f "$staging/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
            find "$staging" -type d -exec chmod 0755 {} +
            find "$staging" -type f -exec chmod 0644 {} +
            find "$staging" -type f -name '*.node' -exec chmod 0755 {} +
            mv "$staging" "$target"
          fi
          TARGET="$target" /usr/bin/node <<'NODE'
          const Database = require(`${process.env.TARGET}/node_modules/better-sqlite3`);
          const sharp = require(`${process.env.TARGET}/node_modules/sharp`);
          const database = new Database(":memory:");
          database.exec("SELECT 1");
          database.close();
          sharp({ create: { width: 1, height: 1, channels: 3, background: "#fff" } }).webp().toBuffer()
            .then((buffer) => { if (!buffer.length) process.exit(1); })
            .catch((error) => { console.error(error); process.exit(1); });
          NODE
          if [ -n "$previous" ] && [ "$previous" != "$target" ]; then
            rm -f "$releases/.previous-$release"
            ln -s "$previous" "$releases/.previous-$release"
            mv -Tf "$releases/.previous-$release" "$releases/previous"
          fi
          rm -f "$releases/.current-$release"
          ln -s "$target" "$releases/.current-$release"
          mv -Tf "$releases/.current-$release" "$releases/current"
          rm -f "$archive"
          rollback_release() {
            if [ -n "$previous" ] && [ -d "$previous" ]; then
              rm -f "$releases/.rollback"
              ln -s "$previous" "$releases/.rollback"
              mv -Tf "$releases/.rollback" "$releases/current"
              sudo -n systemctl restart quiz-platform || true
            fi
          }
          application_origin=http://127.0.0.1:3333
          if ! sudo -n systemctl restart quiz-platform || ! sudo -n systemctl is-active quiz-platform >/dev/null || \
             ! curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-all-errors -H 'Host: knowyourself.cc.cd' "$application_origin/" -o /dev/null || \
             ! test "$(curl --fail --silent --show-error -H 'Host: knowyourself.cc.cd' "$application_origin/api/auth/get-session")" = null; then
            rollback_release
            exit 1
          fi
          for path in /test/big-five/ /assessments/ /journal/ /community/ /privacy/ /complaints/ /api/config/turnstile /quiz-media/animal-personality/cover.webp; do
            if ! curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors \
              -H 'Host: knowyourself.cc.cd' "$application_origin$path" -o /dev/null; then
              rollback_release
              exit 1
            fi
          done
          home_metadata="$(curl --fail --silent --show-error -A 'Twitterbot/1.0' -H 'Host: knowyourself.cc.cd' "$application_origin/")"
          home_og_title_tag="$(printf '%s' "$home_metadata" | grep -Eo '<meta property="og:title" content="[^"]+"/>' | head -n 1 || true)"
          home_twitter_title_tag="$(printf '%s' "$home_metadata" | grep -Eo '<meta name="twitter:title" content="[^"]+"/>' | head -n 1 || true)"
          assert_public_metadata() {
            local path="$1"
            local html og_title_tag twitter_title_tag
            html="$(curl --fail --silent --show-error -A 'Twitterbot/1.0' -H 'Host: knowyourself.cc.cd' "$application_origin$path")" || return 1
            og_title_tag="$(printf '%s' "$html" | grep -Eo '<meta property="og:title" content="[^"]+"/>' | head -n 1 || true)"
            twitter_title_tag="$(printf '%s' "$html" | grep -Eo '<meta name="twitter:title" content="[^"]+"/>' | head -n 1 || true)"
            [ -n "$home_og_title_tag" ] && [ -n "$home_twitter_title_tag" ] &&
              printf '%s' "$html" | grep -F "<link rel=\"canonical\" href=\"https://knowyourself.cc.cd$path\"/>" >/dev/null &&
              printf '%s' "$html" | grep -F "<meta property=\"og:url\" content=\"https://knowyourself.cc.cd$path\"/>" >/dev/null &&
              [ -n "$og_title_tag" ] && [ "$og_title_tag" != "$home_og_title_tag" ] &&
              [ -n "$twitter_title_tag" ] && [ "$twitter_title_tag" != "$home_twitter_title_tag" ] &&
              ! printf '%s' "$html" | grep -F '| Know Yourself | Know Yourself</title>' >/dev/null
          }
          for path in /test/big-five/ /assessments/ /complaints/; do
            if ! assert_public_metadata "$path"; then
              rollback_release
              exit 1
            fi
          done
          # The auth probe above runs database migrations. Verify that the
          # supervisor and its worker then remain the same live processes.
          media_worker_pids() {
            local supervisor_pid="$1"
            local candidate candidate_pid parent_pid
            for candidate in /proc/[0-9]*; do
              [ -r "$candidate/status" ] && [ -r "$candidate/cmdline" ] || continue
              candidate_pid="${candidate##*/}"
              parent_pid="$(awk '$1 == "PPid:" { print $2; exit }' "$candidate/status" 2>/dev/null || true)"
              [ "$parent_pid" = "$supervisor_pid" ] || continue
              if grep -zEq '(^|/)media-worker\.mjs$' "$candidate/cmdline"; then
                printf '%s\n' "$candidate_pid"
              fi
            done
          }
          if ! supervisor_pid="$(systemctl show --property MainPID --value quiz-platform)" || \
             ! [[ "$supervisor_pid" =~ ^[1-9][0-9]*$ ]] || ! kill -0 "$supervisor_pid" 2>/dev/null; then
            echo "quiz-platform supervisor PID is unavailable after restart" >&2
            rollback_release
            exit 1
          fi
          worker_pid=""
          for attempt in {1..20}; do
            mapfile -t worker_pids < <(media_worker_pids "$supervisor_pid")
            if [ "${#worker_pids[@]}" -eq 1 ]; then
              worker_pid="${worker_pids[0]}"
              break
            fi
            sleep 1
          done
          if ! [[ "$worker_pid" =~ ^[1-9][0-9]*$ ]] || ! kill -0 "$worker_pid" 2>/dev/null; then
            echo "media worker did not become healthy after restart" >&2
            rollback_release
            exit 1
          fi
          sleep 10
          if ! stable_supervisor_pid="$(systemctl show --property MainPID --value quiz-platform)"; then
            echo "quiz-platform supervisor PID could not be re-read" >&2
            rollback_release
            exit 1
          fi
          mapfile -t stable_worker_pids < <(media_worker_pids "$supervisor_pid")
          if [ "$stable_supervisor_pid" != "$supervisor_pid" ] || ! kill -0 "$supervisor_pid" 2>/dev/null || \
             [ "${#stable_worker_pids[@]}" -ne 1 ] || [ "${stable_worker_pids[0]:-}" != "$worker_pid" ] || \
             ! kill -0 "$worker_pid" 2>/dev/null; then
            echo "quiz-platform supervisor or media worker restarted during the health window" >&2
            rollback_release
            exit 1
          fi
          echo "quiz-platform supervisor $supervisor_pid and media worker $worker_pid remained stable"
          REMOTE
      - name: Smoke test public origin
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          canonical_host=knowyourself.cc.cd
          www_host=www.knowyourself.cc.cd
          legacy_host=loveyourself.cc.cd
          maintenance_host=quiz.107-151-246-167.sslip.io
          test_path=/test/big-five/
          smoke_paths=("$test_path" /assessments/ /journal/ /community/ /privacy/ /complaints/ /api/config/turnstile /quiz-media/animal-personality/cover.webp)

          curl --fail --silent --show-error --retry 5 --retry-all-errors --resolve "$maintenance_host:443:$VPS_HOST" "https://$maintenance_host/" -o /dev/null
          for path in "${smoke_paths[@]}"; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --resolve "$maintenance_host:443:$VPS_HOST" "https://$maintenance_host$path" -o /dev/null
          done
          test "$(curl --fail --silent --show-error --resolve "$maintenance_host:443:$VPS_HOST" "https://$maintenance_host/healthz")" = ok
          curl --fail --silent --show-error --resolve "$maintenance_host:443:$VPS_HOST" "https://$maintenance_host/robots.txt" | grep -F "Sitemap: https://$canonical_host/sitemap.xml"
          curl --fail --silent --show-error --resolve "$maintenance_host:443:$VPS_HOST" "https://$maintenance_host/sitemap.xml" | grep -F "<loc>https://$canonical_host$test_path</loc>"
          curl --fail --silent --show-error --resolve "$maintenance_host:443:$VPS_HOST" "https://$maintenance_host/sitemap.xml" | grep -F "<loc>https://$canonical_host/assessments/</loc>"

          home_metadata="$(curl --fail --silent --show-error -A 'Twitterbot/1.0' --resolve "$maintenance_host:443:$VPS_HOST" "https://$maintenance_host/")"
          home_og_title_tag="$(printf '%s' "$home_metadata" | grep -Eo '<meta property="og:title" content="[^"]+"/>' | head -n 1 || true)"
          home_twitter_title_tag="$(printf '%s' "$home_metadata" | grep -Eo '<meta name="twitter:title" content="[^"]+"/>' | head -n 1 || true)"
          assert_public_metadata() {
            local request_host="$1"
            local path="$2"
            local html og_title_tag twitter_title_tag
            html="$(curl --fail --silent --show-error -A 'Twitterbot/1.0' --resolve "$request_host:443:$VPS_HOST" "https://$request_host$path")" || return 1
            og_title_tag="$(printf '%s' "$html" | grep -Eo '<meta property="og:title" content="[^"]+"/>' | head -n 1 || true)"
            twitter_title_tag="$(printf '%s' "$html" | grep -Eo '<meta name="twitter:title" content="[^"]+"/>' | head -n 1 || true)"
            [ -n "$home_og_title_tag" ] && [ -n "$home_twitter_title_tag" ] &&
              printf '%s' "$html" | grep -F "<link rel=\"canonical\" href=\"https://$canonical_host$path\"/>" >/dev/null &&
              printf '%s' "$html" | grep -F "<meta property=\"og:url\" content=\"https://$canonical_host$path\"/>" >/dev/null &&
              [ -n "$og_title_tag" ] && [ "$og_title_tag" != "$home_og_title_tag" ] &&
              [ -n "$twitter_title_tag" ] && [ "$twitter_title_tag" != "$home_twitter_title_tag" ] &&
              ! printf '%s' "$html" | grep -F '| Know Yourself | Know Yourself</title>' >/dev/null
          }
          for path in "$test_path" /assessments/ /complaints/; do
            assert_public_metadata "$maintenance_host" "$path"
          done

          resolves_to_origin() {
            getent ahostsv4 "$1" | awk -v expected="$VPS_HOST" '$1 == expected { found = 1 } END { exit !found }'
          }

          tls_ready() {
            curl --silent --show-error --output /dev/null --connect-timeout 5 --max-time 15 \
              --resolve "$1:443:$VPS_HOST" "https://$1/"
          }

          if ! resolves_to_origin "$canonical_host" || ! resolves_to_origin "$www_host"; then
            echo "::notice::Canonical DNS is not active at the production origin yet; maintenance-host checks passed."
          elif ! tls_ready "$canonical_host" || ! tls_ready "$www_host"; then
            echo "::notice::Canonical TLS certificates are not ready yet; maintenance-host checks passed."
          else
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --resolve "$legacy_host:443:$VPS_HOST" "https://$legacy_host$test_path")" = 301
            test "$(curl --silent --show-error --head --resolve "$legacy_host:443:$VPS_HOST" "https://$legacy_host$test_path" | tr -d '\r' | awk 'BEGIN { IGNORECASE=1 } /^location:/ { print $2; exit }')" = "https://$canonical_host$test_path"
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --resolve "$www_host:443:$VPS_HOST" "https://$www_host$test_path")" = 301
            test "$(curl --silent --show-error --head --resolve "$www_host:443:$VPS_HOST" "https://$www_host$test_path" | tr -d '\r' | awk 'BEGIN { IGNORECASE=1 } /^location:/ { print $2; exit }')" = "https://$canonical_host$test_path"
            curl --fail --silent --show-error --retry 5 --retry-all-errors --resolve "$canonical_host:443:$VPS_HOST" "https://$canonical_host/" -o /dev/null
            for path in "${smoke_paths[@]}"; do
              curl --fail --silent --show-error --retry 5 --retry-all-errors --resolve "$canonical_host:443:$VPS_HOST" "https://$canonical_host$path" -o /dev/null
            done
            test "$(curl --fail --silent --show-error --resolve "$canonical_host:443:$VPS_HOST" "https://$canonical_host/healthz")" = ok
            curl --fail --silent --show-error --resolve "$canonical_host:443:$VPS_HOST" "https://$canonical_host/robots.txt" | grep -F "Sitemap: https://$canonical_host/sitemap.xml"
            curl --fail --silent --show-error --resolve "$canonical_host:443:$VPS_HOST" "https://$canonical_host/sitemap.xml" | grep -F "<loc>https://$canonical_host$test_path</loc>"
            curl --fail --silent --show-error --resolve "$canonical_host:443:$VPS_HOST" "https://$canonical_host/sitemap.xml" | grep -F "<loc>https://$canonical_host/assessments/</loc>"
            for path in "$test_path" /assessments/ /complaints/; do
              assert_public_metadata "$canonical_host" "$path"
            done
          fi
