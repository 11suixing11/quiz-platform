<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理测试平台 | Psychology Quiz Platform</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
</head>
<body>
    <!-- Floating Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>

    <!-- Hero Section -->
    <section class="hero" id="hero">
        <div class="hero-overlay"></div>
        <div class="hero-particles" id="heroParticles"></div>
        <div class="hero-content">
            <div class="hero-icon">
                <svg viewBox="0 0 100 100" width="100" height="100">
                    <defs>
                        <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#D4A8B8;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#C9B8D8;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#A8C5D8;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M50 10 C30 10 15 25 15 45 C15 55 20 65 30 70 C25 75 25 85 35 90 C40 92 45 90 50 85 C55 90 60 92 65 90 C75 85 75 75 70 70 C80 65 85 55 85 45 C85 25 70 10 50 10Z"
                          fill="url(#brainGradient)" stroke="none"/>
                    <path d="M50 20 C50 20 40 35 40 50 C40 65 50 75 50 75" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
                    <path d="M50 20 C50 20 60 35 60 50 C60 65 50 75 50 75" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="35" cy="40" r="3" fill="rgba(255,255,255,0.6)"/>
                    <circle cx="65" cy="40" r="3" fill="rgba(255,255,255,0.6)"/>
                    <circle cx="50" cy="55" r="3" fill="rgba(255,255,255,0.6)"/>
                </svg>
            </div>
            <h1 class="hero-title" id="heroTitle">心理测试平台</h1>
            <p class="hero-subtitle" id="heroSubtitle"></p>
            <div class="hero-stats">
                <div class="stat"><span class="stat-num">114</span><span class="stat-label" id="statTests">种测试</span></div>
                <div class="stat"><span class="stat-num">9</span><span class="stat-label" id="statCategories">大分类</span></div>
                <div class="stat"><span class="stat-num">100%</span><span class="stat-label" id="statFree">免费</span></div>
            </div>
            <div class="scroll-indicator" id="scrollIndicator">
                <span id="scrollText">向下滚动探索测试</span>
                <div class="scroll-arrow"></div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <!-- Language Switch -->
        <button class="lang-switch" onclick="toggleLanguage()">EN/中</button>

        <!-- Search & Filter Bar -->
        <div class="search-bar" id="searchBar">
            <div class="search-input-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></svg>
                <input type="text" class="search-input" id="searchInput" placeholder="搜索测试..." oninput="onSearchInput()" onfocus="onSearchFocus()" autocomplete="off">
                <button class="search-clear" id="searchClear" onclick="clearSearch()" style="display:none">&#10005;</button>
                <div class="search-dropdown" id="searchDropdown"></div>
            </div>
            <div class="category-tags" id="categoryTags">
                <button class="tag active" data-category="all" onclick="filterByCategory('all')">全部</button>
            </div>
        </div>

        <!-- Test Categories -->
        <div class="categories-container" id="categoriesContainer">
            <!-- Categories will be generated by JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p id="footerText">本平台所有测试仅供参考，不构成专业心理诊断。</p>
    </footer>

    <!-- Scripts -->
    <script src="js/test-registry.js?v=2"></script>
    <script>
        let currentLang = 'zh';
        let typed = null;
        let activeCategory = 'all';

        // Initialize
        function init() {
            const savedLang = localStorage.getItem('quiz-platform-lang');
            if (savedLang) currentLang = savedLang;

            renderCategoryTags();
            renderAllCategories();
            updateLanguage();
            initHeroParticles();
            initScrollEffects();
        }

        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('quiz-platform-lang', currentLang);
            renderCategoryTags();
            renderAllCategories();
            updateLanguage();
        }

        // Update language
        function updateLanguage() {
            const isZh = currentLang === 'zh';
            document.getElementById('heroTitle').textContent = isZh ? '心理测试平台' : 'Psychology Quiz Platform';
            document.title = isZh ? '心理测试平台 | Psychology Quiz Platform' : 'Psychology Quiz Platform';

            document.getElementById('statTests').textContent = isZh ? '种测试' : 'Tests';
            document.getElementById('statCategories').textContent = isZh ? '大分类' : 'Categories';
            document.getElementById('statFree').textContent = isZh ? '免费' : 'Free';
            document.getElementById('scrollText').textContent = isZh ? '向下滚动探索测试' : 'Scroll down to explore';
            document.getElementById('searchInput').placeholder = isZh ? '搜索测试...' : 'Search tests...';
            document.getElementById('footerText').textContent = isZh
                ? '本平台所有测试仅供参考，不构成专业心理诊断。'
                : 'All tests on this platform are for reference only and do not constitute professional psychological diagnosis.';

            // Typing effect
            if (typed) typed.destroy();
            const subtitles = isZh
                ? ['探索你的内心世界', '发现真实的自己', '了解你的性格特点', '114种专业心理测试', '认识更好的你']
                : ['Explore Your Inner World', 'Discover Your True Self', 'Understand Your Personality', '114 Professional Psychology Tests', 'Know Yourself Better'];
            typed = new Typed('#heroSubtitle', {
                strings: subtitles,
                typeSpeed: 50,
                backSpeed: 30,
                backDelay: 2000,
                loop: true
            });
        }

        // Render category filter tags
        function renderCategoryTags() {
            const container = document.getElementById('categoryTags');
            const isZh = currentLang === 'zh';
            container.innerHTML = `<button class="tag active" data-category="all" onclick="filterByCategory('all')">${isZh ? '全部' : 'All'}</button>`;
            TEST_CATEGORIES.forEach(cat => {
                container.innerHTML += `<button class="tag" data-category="${cat.id}" onclick="filterByCategory('${cat.id}')">${cat.icon} ${isZh ? cat.zh : cat.en}</button>`;
            });
        }

        // Render all categories with test cards
        function renderAllCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';
            const isZh = currentLang === 'zh';

            TEST_CATEGORIES.forEach(cat => {
                const tests = getTestsByCategory(cat.id);
                if (tests.length === 0) return;

                const section = document.createElement('section');
                section.className = 'category-section';
                section.id = `cat-${cat.id}`;
                section.innerHTML = `
                    <div class="category-header">
                        <span class="category-icon">${cat.icon}</span>
                        <div>
                            <h2 class="category-title">${isZh ? cat.zh : cat.en}</h2>
                            <p class="category-desc">${isZh ? cat.desc : cat.descEn}</p>
                        </div>
                    </div>
                    <div class="test-grid">
                        ${tests.map(t => `
                            <a class="test-card" href="quiz.html?type=${t.id}">
                                <div class="card-icon">${t.icon}</div>
                                <h3>${isZh ? t.zh.name : t.en.name}</h3>
                                <p>${isZh ? t.zh.description : t.en.description}</p>
                                <div class="meta">
                                    <span class="questions">${t.questions} ${isZh ? '题' : 'Q'}</span>
                                    <span>${t.time} ${isZh ? '分钟' : 'min'}</span>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                `;
                container.appendChild(section);
            });
        }

        // Filter by category
        function filterByCategory(categoryId) {
            activeCategory = categoryId;
            document.querySelectorAll('.tag').forEach(t => t.classList.toggle('active', t.dataset.category === categoryId));

            // Clear search and restore categories if needed
            var si = document.getElementById('searchInput');
            var hadSearch = si && si.value.trim();
            if (hadSearch) {
                si.value = '';
                document.getElementById('searchClear').style.display = 'none';
                hideDropdown();
                renderAllCategories();
            }

            if (categoryId === 'all') {
                document.querySelectorAll('.category-section').forEach(s => s.style.display = '');
            } else {
                document.querySelectorAll('.category-section').forEach(s => {
                    s.style.display = s.id === 'cat-' + categoryId ? '' : 'none';
                });
            }
        }

        // === Search ===
        var _searchTimer = null;
        var _justCleared = false;

        function onSearchInput() {
            var q = document.getElementById('searchInput').value.trim();
            document.getElementById('searchClear').style.display = q ? 'flex' : 'none';
            clearTimeout(_searchTimer);
            _searchTimer = setTimeout(function() {
                if (q) {
                    doSearch(q);
                } else {
                    hideDropdown();
                    showAllCategories();
                }
            }, 200);
        }

        function onSearchFocus() {
            if (_justCleared) { _justCleared = false; return; }
            var q = document.getElementById('searchInput').value.trim();
            if (q) {
                doSearch(q);
            }
        }

        function clearSearch() {
            _justCleared = true;
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClear').style.display = 'none';
            hideDropdown();
            showAllCategories();
        }

        function doSearch(query) {
            try {
                var results = searchTests(query, currentLang);
                var isZh = currentLang === 'zh';
                var container = document.getElementById('categoriesContainer');

                // Show dropdown with top results
                var dropdown = document.getElementById('searchDropdown');
                if (results.length === 0) {
                    dropdown.innerHTML = '<div class="dropdown-empty">' + (isZh ? '未找到匹配结果' : 'No matches found') + '</div>';
                } else {
                    var items = results.slice(0, 8);
                    dropdown.innerHTML = items.map(function(t) {
                        return '<a class="dropdown-item" href="quiz.html?type=' + t.id + '">' +
                            '<span class="dropdown-icon">' + t.icon + '</span>' +
                            '<div class="dropdown-info"><div class="dropdown-name">' + (isZh ? t.zh.name : t.en.name) + '</div>' +
                            '<div class="dropdown-desc">' + (isZh ? t.zh.description : t.en.description) + '</div></div>' +
                            '<span class="dropdown-cat">' + getCategoryLabel(t.category, isZh) + '</span></a>';
                    }).join('');
                }
                dropdown.classList.add('show');

                // Also update main content area
                container.innerHTML = '';
                if (results.length === 0) {
                    container.innerHTML = '<div class="no-results">' + (isZh ? '未找到相关测试' : 'No tests found') + '</div>';
                } else {
                    var section = document.createElement('section');
                    section.className = 'category-section visible';
                    section.innerHTML = '<div class="category-header"><span class="category-icon">🔍</span><div>' +
                        '<h2 class="category-title">' + (isZh ? '搜索结果' : 'Search Results') + '</h2>' +
                        '<p class="category-desc">' + (isZh ? '找到 ' + results.length + ' 个测试' : 'Found ' + results.length + ' tests') + '</p></div></div>' +
                        '<div class="test-grid">' + results.map(function(t) {
                            return '<a class="test-card" href="quiz.html?type=' + t.id + '">' +
                                '<div class="card-icon">' + t.icon + '</div>' +
                                '<h3>' + (isZh ? t.zh.name : t.en.name) + '</h3>' +
                                '<p>' + (isZh ? t.zh.description : t.en.description) + '</p>' +
                                '<div class="meta"><span class="questions">' + t.questions + (isZh ? ' 题' : ' Q') + '</span>' +
                                '<span>' + t.time + (isZh ? ' 分钟' : ' min') + '</span></div></a>';
                        }).join('') + '</div>';
                    container.appendChild(section);
                }
            } catch (e) {
                console.error('Search error:', e);
            }
        }

        function showAllCategories() {
            renderAllCategories();
            filterByCategory(activeCategory);
        }

        function hideDropdown() {
            document.getElementById('searchDropdown').classList.remove('show');
        }

        function getCategoryLabel(catId, isZh) {
            var cat = TEST_CATEGORIES.find(function(c) { return c.id === catId; });
            return cat ? (isZh ? cat.zh : cat.en) : '';
        }

        // Close dropdown on outside click
        document.addEventListener('click', function(e) {
            var wrap = document.querySelector('.search-input-wrap');
            if (wrap && !wrap.contains(e.target)) hideDropdown();
        });

        // Hero particles
        function initHeroParticles() {
            const container = document.getElementById('heroParticles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'hero-particle';
                const size = Math.random() * 4 + 2;
                p.style.cssText = `
                    width: ${size}px; height: ${size}px;
                    left: ${Math.random() * 100}%;
                    top: ${Math.random() * 100}%;
                    animation-delay: ${Math.random() * 6}s;
                    animation-duration: ${Math.random() * 4 + 4}s;
                `;
                container.appendChild(p);
            }
        }

        // Scroll effects
        function initScrollEffects() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.category-section').forEach(s => observer.observe(s));

            // Hide scroll indicator on scroll
            window.addEventListener('scroll', () => {
                const indicator = document.getElementById('scrollIndicator');
                if (window.scrollY > 100) {
                    indicator.style.opacity = '0';
                } else {
                    indicator.style.opacity = '1';
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
