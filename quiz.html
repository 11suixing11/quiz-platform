<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试中 | Quiz in Progress</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="neuralCanvas"></canvas>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>

    <div id="debugPanel" style="position:fixed;top:60px;right:10px;background:rgba(0,0,0,0.8);color:#0f0;padding:12px;border-radius:8px;font-size:11px;z-index:9999;max-width:300px;font-family:monospace;white-space:pre-wrap;"></div>

    <div class="container">
        <button class="lang-switch" onclick="toggleLanguage()">EN/中</button>

        <!-- Quiz Page -->
        <div class="quiz-page" id="quizPage">
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText"></div>
            </div>

            <div class="question-card fade-in" id="questionCard">
                <div class="question-number" id="questionNumber"></div>
                <div class="question-text" id="questionText"></div>
                <div class="options-container" id="optionsContainer"></div>
            </div>

            <div class="nav-buttons">
                <button class="nav-btn prev" id="prevBtn" onclick="prevQuestion()" disabled></button>
                <button class="nav-btn home" id="homeBtn" onclick="goHome()">🏠</button>
                <button class="nav-btn" id="nextBtn" onclick="nextQuestion()"></button>
            </div>
        </div>

        <!-- Loading Page -->
        <div class="loading-page" id="loadingPage">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/test-registry.js"></script>
    <script src="js/quiz-engine.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const testType = urlParams.get('type');
        let engine = null;
        let testData = null;

        function debug(msg) {
            var el = document.getElementById('debugPanel');
            if (el) el.textContent += msg + '\n';
        }

        function init() {
            debug('init() called, testType=' + testType);

            if (!testType) {
                debug('No testType, redirecting...');
                window.location.href = 'index.html';
                return;
            }

            debug('Calling loadTest...');
            // Dynamically load test data
            loadTest(testType, function(err, data) {
                if (err) {
                    debug('loadTest ERROR: ' + err.message);
                    document.getElementById('questionText').textContent = 'Error: ' + err.message;
                    document.getElementById('questionNumber').textContent = '';
                    document.getElementById('optionsContainer').innerHTML = '';
                    return;
                }

                debug('loadTest OK, data type=' + typeof data + ', questions=' + (data && data.questions ? data.questions.length : 'null'));
                testData = data;
                engine = new QuizEngine(testType, testData);
                debug('Engine created, questions=' + engine.shuffledQuestions.length + ', current=' + engine.currentQuestion);

                showQuestion(engine.currentQuestion);
                updateLanguage();
                debug('Ready!');
            });
        }

        function toggleLanguage() {
            engine.toggleLanguage();
            updateLanguage();
            showQuestion(engine.currentQuestion);
        }

        function updateLanguage() {
            const text = engine.getUIText();
            document.getElementById('prevBtn').textContent = text.prevBtn || 'Previous';
            document.getElementById('nextBtn').textContent = engine.currentQuestion === engine.shuffledQuestions.length - 1 ? (text.submitBtn || 'Submit') : (text.nextBtn || 'Next');
            document.getElementById('loadingText').textContent = text.loading || 'Loading...';
            document.title = `${text.title || 'Quiz'} | Quiz Platform`;
        }

        function showQuestion(index) {
            debug('showQuestion(' + index + ')');
            const question = engine.getCurrentQuestion();
            const text = engine.getUIText();
            const lang = engine.currentLang;

            debug('question=' + (question ? 'OK' : 'NULL') + ', lang=' + lang + ', text.question=' + (text ? text.question : 'NULL'));

            if (!question) {
                document.getElementById('questionText').textContent = 'Error: question not found';
                return;
            }

            document.getElementById('questionNumber').textContent = (text.question || 'Question') + ' ' + (index + 1);
            document.getElementById('questionText').textContent = question[lang] || question.zh || JSON.stringify(question);

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            const options = (question.options && question.options[lang]) || (question.options && question.options.zh) || [];
            options.forEach((option, i) => {
                const btn = document.createElement('button');
                btn.className = `option-btn ${engine.answers[index] === i ? 'selected' : ''}`;
                btn.textContent = option;
                btn.onclick = () => selectOption(index, i);
                optionsContainer.appendChild(btn);
            });

            const progress = engine.getProgress();
            document.getElementById('progressFill').style.width = `${progress.percentage}%`;
            document.getElementById('progressText').textContent = `${text.progress || 'Progress'}: ${progress.current} ${text.of || '/'} ${progress.total}`;

            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').textContent = index === engine.shuffledQuestions.length - 1 ? (text.submitBtn || 'Submit') : (text.nextBtn || 'Next');

            document.getElementById('questionCard').classList.remove('fade-in');
            void document.getElementById('questionCard').offsetWidth;
            document.getElementById('questionCard').classList.add('fade-in');
        }

        function selectOption(questionIndex, optionIndex) {
            engine.selectAnswer(questionIndex, optionIndex);
            const options = document.querySelectorAll('.option-btn');
            options.forEach((btn, i) => {
                btn.classList.toggle('selected', i === optionIndex);
                btn.disabled = true;
            });

            setTimeout(() => {
                if (engine.currentQuestion === engine.shuffledQuestions.length - 1) {
                    showLoading();
                } else {
                    engine.nextQuestion();
                    showQuestion(engine.currentQuestion);
                }
            }, 200);
        }

        function nextQuestion() {
            if (engine.answers[engine.currentQuestion] === -1) {
                alert(engine.currentLang === 'zh' ? '请选择一个选项' : 'Please select an option');
                return;
            }
            if (engine.currentQuestion === engine.shuffledQuestions.length - 1) {
                showLoading();
                return;
            }
            engine.nextQuestion();
            showQuestion(engine.currentQuestion);
        }

        function prevQuestion() {
            if (engine.prevQuestion()) {
                showQuestion(engine.currentQuestion);
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        function showLoading() {
            document.getElementById('quizPage').style.display = 'none';
            document.getElementById('loadingPage').style.display = 'flex';
            document.getElementById('loadingPage').classList.add('fade-in');

            setTimeout(() => {
                const results = engine.calculateResults();
                localStorage.setItem(`quiz-results-${testType}`, JSON.stringify(results));
                window.location.href = `result.html?type=${testType}`;
            }, 2000);
        }

        // Soft Watercolor Canvas
        function initNeuralCanvas() {
            const canvas = document.getElementById('neuralCanvas');
            const ctx = canvas.getContext('2d');
            function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const monetColors = [
                [212,168,184], [168,197,216], [184,201,168],
                [201,184,216], [216,197,168], [232,180,184]
            ];

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.3;
                    this.vy = (Math.random() - 0.5) * 0.3;
                    this.radius = Math.random() * 2 + 1;
                    this.color = monetColors[Math.floor(Math.random() * monetColors.length)];
                    this.alpha = Math.random() * 0.15 + 0.05;
                    this.pulse = Math.random() * Math.PI * 2;
                    this.pulseSpeed = Math.random() * 0.015 + 0.005;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    if (this.x < -50 || this.x > canvas.width + 50) this.vx *= -1;
                    if (this.y < -50 || this.y > canvas.height + 50) this.vy *= -1;
                    this.pulse += this.pulseSpeed;
                }
                draw() {
                    const a = this.alpha + Math.sin(this.pulse) * 0.05;
                    const r = this.radius * (1 + Math.sin(this.pulse) * 0.3);
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 6);
                    gradient.addColorStop(0, `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${a})`);
                    gradient.addColorStop(1, `rgba(${this.color[0]},${this.color[1]},${this.color[2]},0)`);
                    ctx.beginPath(); ctx.arc(this.x, this.y, r * 6, 0, Math.PI * 2);
                    ctx.fillStyle = gradient; ctx.fill();
                }
            }

            const particles = [];
            const count = Math.min(30, Math.floor(canvas.width * canvas.height / 30000));
            for (let i = 0; i < count; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();
        }

        window.onload = function() {
            initNeuralCanvas();
            try {
                init();
            } catch(e) {
                document.getElementById('questionText').textContent = 'Init error: ' + e.message;
                document.getElementById('questionNumber').textContent = '';
            }
        };
    </script>
</body>
</html>
