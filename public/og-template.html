<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; position: relative; display: grid; grid-template-columns: 1.2fr .8fr; gap: 70px; align-items: center; padding: 78px 86px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #17221f; background: #f4f0e7; }
  .contour { position: absolute; width: 380px; height: 380px; right: 4px; top: 34px; border: 2px solid rgba(47,107,95,.18); border-radius: 50%; }
  .contour::before, .contour::after { content: ""; position: absolute; inset: 42px; border: 1px solid rgba(47,107,95,.17); border-radius: 50%; }
  .contour::after { inset: 84px; }
  .kicker { color: #2f6b5f; font-size: 19px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
  h1 { margin: 30px 0 24px; max-width: 690px; font-size: 76px; line-height: .98; letter-spacing: -.06em; }
  p { margin: 0; max-width: 620px; color: #5e6965; font-size: 26px; line-height: 1.45; }
  .map { position: relative; width: 350px; height: 370px; border: 1px solid rgba(23,34,31,.18); border-radius: 24px; background: rgba(255,255,255,.24); transform: rotate(2deg); }
  .route { position: absolute; inset: 30px; }
  .route svg { width: 100%; height: 100%; }
  .pin { position: absolute; width: 18px; height: 18px; border: 4px solid #f4f0e7; border-radius: 50%; background: #2f6b5f; box-shadow: 0 0 0 8px rgba(47,107,95,.14); }
  .a { left: 54px; bottom: 58px; } .b { left: 152px; top: 156px; } .c { right: 48px; top: 66px; }
  .brand { position: absolute; left: 86px; bottom: 42px; color: rgba(23,34,31,.42); font-size: 17px; font-weight: 700; letter-spacing: .08em; }
</style>
</head>
<body>
  <div class="contour"></div>
  <main><div class="kicker">A quiet place to notice</div><h1>Know Yourself</h1><p>16 reviewed bilingual assessments. Notice a pattern, then carry one useful question into daily life.</p></main>
  <aside class="map"><div class="route"><svg viewBox="0 0 290 310" fill="none"><circle cx="145" cy="130" r="72" fill="#f2d7c5" fill-opacity=".82"/><circle cx="222" cy="198" r="50" fill="#4f705f" fill-opacity=".78"/><path d="M18 260C64 219 74 242 113 190C151 139 165 180 202 125C236 75 252 96 278 42" stroke="#2f6b5f" stroke-width="3"/><path d="M8 286C80 270 105 279 151 233C202 183 223 211 279 156" stroke="#936451" stroke-opacity=".55" stroke-width="2"/></svg></div><span class="pin a"></span><span class="pin b"></span><span class="pin c"></span></aside>
  <div class="brand">认识你自己 / KNOW YOURSELF</div>
</body>
</html>
