<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #FAFAF8 0%, #F1ECE3 100%);
    color: #2D2A26;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  body::before {
    content: "";
    position: absolute;
    inset: 56px;
    border: 1px solid rgba(45, 42, 38, 0.1);
  }

  .panel {
    width: 980px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 64px;
    align-items: center;
  }

  .kicker {
    font-size: 22px;
    font-weight: 700;
    color: #8A8078;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .title {
    font-size: 72px;
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: 0;
    margin-bottom: 28px;
  }

  .subtitle {
    font-size: 28px;
    line-height: 1.45;
    color: #665F58;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  .tile {
    height: 118px;
    border: 1px solid rgba(45, 42, 38, 0.12);
    background: rgba(255, 255, 255, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #73695F;
  }

  .brand {
    position: absolute;
    bottom: 40px;
    left: 80px;
    font-size: 18px;
    font-weight: 700;
    color: #B8AFA5;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="panel">
    <main>
      <div class="kicker">Self-reflection quizzes</div>
      <div class="title">Know Yourself</div>
      <div class="subtitle">100+ quizzes across personality, emotions, relationships, career, and habits. Not a clinical tool.</div>
    </main>
    <aside class="grid">
      <div class="tile">Personality</div>
      <div class="tile">Emotion</div>
      <div class="tile">Career</div>
      <div class="tile">Habits</div>
    </aside>
  </div>
  <div class="brand">quiz-platform</div>
</body>
</html>
