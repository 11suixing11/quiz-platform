<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试结果 | Quiz Results</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
    <canvas id="neuralCanvas"></canvas>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>

    <div class="container">
        <button class="lang-switch" onclick="toggleLanguage()">EN/中</button>

        <div class="result-page" id="resultPage">
            <div class="result-header">
                <div class="result-icon" id="resultIcon"></div>
                <h2 id="resultTitle"></h2>
                <div class="result-score" id="resultScore"></div>
            </div>

            <div class="score-bar" id="scoreBarContainer">
                <div class="score-fill" id="scoreFill"></div>
            </div>
            <div class="score-labels" id="scoreLabels">
                <span id="scoreLabelLeft"></span>
                <span id="scoreLabelRight"></span>
            </div>

            <div class="result-description" id="resultDescription"></div>
            <div class="category-scores" id="categoryScores"></div>
            <div class="disclaimer" id="disclaimer"></div>

            <div class="action-buttons">
                <button class="action-btn primary" onclick="restartQuiz()" id="restartBtn"></button>
                <button class="action-btn secondary" onclick="goHome()" id="homeBtn"></button>
                <button class="action-btn secondary" onclick="shareResult()" id="shareBtn"></button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/test-registry.js?v=2"></script>
    <script src="js/result-renderers.js?v=2"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const testType = urlParams.get('type');
        let currentLang = 'zh';
        let testData = null;
        let results = null;

        function init() {
            if (!testType) { window.location.href = 'index.html'; return; }

            const savedLang = localStorage.getItem('quiz-platform-lang');
            if (savedLang) currentLang = savedLang;

            const savedResults = localStorage.getItem(`quiz-results-${testType}`);
            if (!savedResults) { window.location.href = `quiz.html?type=${testType}`; return; }
            results = JSON.parse(savedResults);

            // Dynamically load test data
            loadTest(testType, function(err, data) {
                if (err) { window.location.href = 'index.html'; return; }
                testData = data;
                renderResults();
                updateLanguage();
                triggerConfetti();
            });
        }

        function triggerConfetti() {
            const monetColors = ['#D4A8B8', '#A8C5D8', '#B8C9A8', '#C9B8D8', '#D8C5A8', '#E8B4B8'];
            confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0, y: 0.6 }, colors: monetColors });
            confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1, y: 0.6 }, colors: monetColors });
            setTimeout(() => { confetti({ particleCount: 100, spread: 100, origin: { y: 0.5 }, colors: monetColors }); }, 300);
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('quiz-platform-lang', currentLang);
            renderResults();
            updateLanguage();
        }

        function updateLanguage() {
            const text = testData.uiText[currentLang];
            document.getElementById('restartBtn').textContent = text.restartBtn;
            document.getElementById('homeBtn').textContent = text.homeBtn;
            document.getElementById('shareBtn').textContent = text.shareBtn;
            document.getElementById('disclaimer').textContent = text.disclaimer;
            document.title = `${text.resultTitle} | Quiz Platform`;
        }

        function renderResults() {
            renderGenericResults(testType, results, testData, currentLang);
        }

        function restartQuiz() {
            localStorage.removeItem(`quiz-results-${testType}`);
            window.location.href = `quiz.html?type=${testType}`;
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        function shareResult() {
            const text = generateShareText(testType, results, testData, currentLang);
            if (navigator.share) {
                navigator.share({ title: currentLang === 'zh' ? '测试结果' : 'Quiz Results', text: text }).catch(console.error);
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    alert(currentLang === 'zh' ? '结果已复制到剪贴板' : 'Result copied to clipboard');
                }).catch(() => { alert(text); });
            }
        }

        // Soft Watercolor Canvas
        function initNeuralCanvas() {
            const canvas = document.getElementById('neuralCanvas');
            const ctx = canvas.getContext('2d');
            function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const monetColors = [
                [212,168,184], [168,197,216], [184,201,168],
                [201,184,216], [216,197,168], [232,180,184]
            ];

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.3;
                    this.vy = (Math.random() - 0.5) * 0.3;
                    this.radius = Math.random() * 2 + 1;
                    this.color = monetColors[Math.floor(Math.random() * monetColors.length)];
                    this.alpha = Math.random() * 0.15 + 0.05;
                    this.pulse = Math.random() * Math.PI * 2;
                    this.pulseSpeed = Math.random() * 0.015 + 0.005;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    if (this.x < -50 || this.x > canvas.width + 50) this.vx *= -1;
                    if (this.y < -50 || this.y > canvas.height + 50) this.vy *= -1;
                    this.pulse += this.pulseSpeed;
                }
                draw() {
                    const a = this.alpha + Math.sin(this.pulse) * 0.05;
                    const r = this.radius * (1 + Math.sin(this.pulse) * 0.3);
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 6);
                    gradient.addColorStop(0, `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${a})`);
                    gradient.addColorStop(1, `rgba(${this.color[0]},${this.color[1]},${this.color[2]},0)`);
                    ctx.beginPath(); ctx.arc(this.x, this.y, r * 6, 0, Math.PI * 2);
                    ctx.fillStyle = gradient; ctx.fill();
                }
            }

            const particles = [];
            const count = Math.min(30, Math.floor(canvas.width * canvas.height / 30000));
            for (let i = 0; i < count; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();
        }

        window.onload = function() { initNeuralCanvas(); init(); };
    </script>
</body>
</html>
